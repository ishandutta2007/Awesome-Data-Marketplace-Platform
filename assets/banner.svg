<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #ffffff;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 20px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #e2e8f0;
    }
    
    /* Dynamic Animations */
    @keyframes pulse-node {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.3); opacity: 1; }
    }
    @keyframes dash-flow {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes float-pill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    .node-pulse {
      animation: pulse-node 4s ease-in-out infinite;
      transform-origin: center;
    }
    .flow-line {
      stroke-dasharray: 10, 10;
      animation: dash-flow 8s linear infinite;
    }
    .floating-card {
      animation: float-pill 6s ease-in-out infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)"/>

  <!-- Decorative Animated Grid & Connections (Background Layer) -->
  <g opacity="0.25">
    <line x1="100" y1="60" x2="400" y2="180" stroke="#6366f1" stroke-width="2" class="flow-line"/>
    <line x1="400" y1="180" x2="1100" y2="80" stroke="#a855f7" stroke-width="2" class="flow-line"/>
    <line x1="400" y1="180" x2="950" y2="290" stroke="#ec4899" stroke-width="2" class="flow-line"/>
    <line x1="100" y1="280" x2="400" y2="180" stroke="#3b82f6" stroke-width="2" class="flow-line"/>

    <circle cx="100" cy="60" r="8" fill="#6366f1" class="node-pulse" filter="url(#glow)"/>
    <circle cx="1100" cy="80" r="10" fill="#a855f7" class="node-pulse" opacity="0.8"/>
    <circle cx="950" cy="290" r="7" fill="#ec4899" class="node-pulse"/>
    <circle cx="100" cy="280" r="9" fill="#3b82f6" class="node-pulse"/>
  </g>

  <!-- Decorative Pills / Graphics (positioned safely on right side) -->
  <g class="floating-card" transform="translate(820, 60)">
    <rect width="280" height="60" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" opacity="0.9"/>
    <circle cx="35" cy="30" r="14" fill="#6366f1"/>
    <text x="31" y="35" font-family="sans-serif" font-size="14" fill="#ffffff" font-weight="bold">⚡</text>
    <text x="65" y="28" font-family="sans-serif" font-size="14" fill="#ffffff" font-weight="600">Zero-Copy Exchange</text>
    <text x="65" y="46" font-family="sans-serif" font-size="12" fill="#64748b">Snowflake • Databricks • AWS</text>
  </g>

  <g class="floating-card" transform="translate(850, 145)" style="animation-delay: -2s;">
    <rect width="280" height="60" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" opacity="0.9"/>
    <circle cx="35" cy="30" r="14" fill="#a855f7"/>
    <text x="30" y="35" font-family="sans-serif" font-size="14" fill="#ffffff" font-weight="bold">🌐</text>
    <text x="65" y="28" font-family="sans-serif" font-size="14" fill="#ffffff" font-weight="600">Open Data Portals</text>
    <text x="65" y="46" font-family="sans-serif" font-size="12" fill="#64748b">CKAN • DataHub • OpenMetadata</text>
  </g>

  <g class="floating-card" transform="translate(800, 230)" style="animation-delay: -4s;">
    <rect width="280" height="60" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" opacity="0.9"/>
    <circle cx="35" cy="30" r="14" fill="#ec4899"/>
    <text x="29" y="35" font-family="sans-serif" font-size="14" fill="#ffffff" font-weight="bold">🔒</text>
    <text x="65" y="28" font-family="sans-serif" font-size="14" fill="#ffffff" font-weight="600">Decentralized &amp; Privacy</text>
    <text x="65" y="46" font-family="sans-serif" font-size="12" fill="#64748b">Ocean Protocol • Compute-to-Data</text>
  </g>

  <!-- Foreground Title and Subtitle (Guaranteed legibility & foreground placement) -->
  <g transform="translate(70, 0)">
    <!-- Decorative Gradient Accent Bar -->
    <rect x="0" y="75" width="160" height="6" rx="3" fill="url(#accent-grad)"/>

    <!-- Main Title -->
    <text x="0" y="140" class="title">Awesome Data Marketplace</text>
    <text x="0" y="190" class="title" fill="url(#accent-grad)">&amp; Exchange Platforms 🚀</text>

    <!-- Subtitle -->
    <text x="0" y="240" class="subtitle">A curated directory of top commercial SaaS data products,</text>
    <text x="0" y="268" class="subtitle">cloud data sharing solutions &amp; open-source data portals.</text>

    <!-- Quick Stats Tags -->
    <g transform="translate(0, 295)">
      <rect x="0" y="0" width="130" height="28" rx="14" fill="#312e81" stroke="#4c1d95"/>
      <text x="16" y="19" class="badge-text">📊 10+ SaaS</text>

      <rect x="142" y="0" width="155" height="28" rx="14" fill="#1e1b4b" stroke="#4338ca"/>
      <text x="156" y="19" class="badge-text">🔓 8+ Open Source</text>

      <rect x="309" y="0" width="155" height="28" rx="14" fill="#831843" stroke="#9d174d"/>
      <text x="323" y="19" class="badge-text">💡 Market Insights</text>
    </g>
  </g>
</svg>
